[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-trap-receiver"
version = "0.1.0"
description = "Syslog receiver for OpenWrt LAN traps: groups connection attempts, applies exclusions, sends alerts and keeps history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["syslog", "openwrt", "nftables", "honeypot", "intrusion-detection", "alerting"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
lantrap = "lantrap.cli:main"

[tool.setuptools]
packages = ["lantrap"]
